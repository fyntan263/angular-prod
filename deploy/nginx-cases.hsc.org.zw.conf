# Host (server) nginx reverse proxy for cases.hsc.org.zw -> Docker container on 4200.
#
# Install on the server:
#   sudo cp nginx-cases.hsc.org.zw.conf /etc/nginx/sites-available/cases.hsc.org.zw
#   sudo ln -sf /etc/nginx/sites-available/cases.hsc.org.zw /etc/nginx/sites-enabled/cases.hsc.org.zw
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS (recommended) run afterwards:
#   sudo certbot --nginx -d cases.hsc.org.zw
# certbot will automatically edit this file to add the TLS server block and
# an HTTP->HTTPS redirect.

server {
    listen 80;
    server_name cases.hsc.org.zw;

    client_max_body_size 55m;

    # Backend API (Spring Boot on :8081) - left intact from the existing deploy.
    location /api/ {
        proxy_pass http://localhost:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://localhost:8081/actuator/;
        proxy_set_header Host $host;
    }

    # Frontend: angular-prod container published on 127.0.0.1:4200
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
