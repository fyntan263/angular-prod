# In-container nginx: serves the Angular SPA on port 4200.
server {
    listen 4200;
    listen [::]:4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for fingerprinted build assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: route everything else to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
